{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm border-0 p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="fw-bold mb-0">+ Cargar Nuevo Cheque</h4>
                <a href="{{ url_for('cartera') }}" class="btn btn-outline-secondary btn-sm">Volver</a>
            </div>
            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Número de Cheque</label>
                        <input type="text" name="numero" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tipo de Cheque</label>
                        <select name="tipo" class="form-select">
                            <option value="Físico">Físico</option>
                            <option value="Echeq">Echeq</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Emisor (Quién firmó)</label>
                        <input type="text" name="emisor" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Banco Emisor</label>
                        <select name="banco" class="form-select">
                            <option>BBVA</option>
                            <option>Banco Macro</option>
                            <option>Banco Galicia</option>
                            <option>Banco Santander</option>
                            <option>Banco Patagonia</option>
                            <option>Banco Ciudad</option>
                            <option>HSBC</option>
                            <option>Banco Comafi</option>
                            <option>Banco Credicoop</option>
                            <option>otro</option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Monto ($)</label>
                        <input type="number" step="0.01" name="monto" class="form-control" required placeholder="0.00">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha de Emisión</label>
                        <input type="date" name="f_emision" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Fecha de Pago</label>
                        <input type="date" name="f_pago" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-4 py-2 fw-semibold">Registrar en el Sistema</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
