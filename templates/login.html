{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-2 text-center"> Acceso al Sistema</h3>
            <p class="text-muted text-center small mb-4">Ingresá tus credenciales para continuar</p>
            {% if error %}
                <div class="alert alert-danger py-2 small">{{ error }}</div>
            {% endif %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label small">Usuario (Correo)</label>
                    <input type="email" name="usuario" class="form-control" required placeholder="correo@ejemplo.com">
                </div>
                <div class="mb-4">
                    <label class="form-label small">Contraseña</label>
                    <input type="password" name="clave" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Iniciar Sesión</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
